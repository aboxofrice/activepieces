# ap-sync helper service, to be merged into the warehouse stack:
#   docker compose -f docker-compose.yml -f compose.ap-sync.yml up -d
# Gets only what it needs from the stack's .env (generated by install.sh): ADMIN_EMAIL /
# ADMIN_PASSWORD (Community has no API keys) and GITHUB_TOKEN. Nothing else: no AP_* secrets.
# Named volumes only (no host paths): the stack may be driven by a containerized installer.
# The image is built from tools/ap-deploy (see its README) and pulled like the app image; the
# default tag is pinned and moves with the installer.
services:
  ap-sync:
    image: ${AP_SYNC_IMAGE:-ghcr.io/aboxofrice/ap-sync:1.1.0}
    restart: unless-stopped
    depends_on:
      - activepieces
    environment:
      AP_URL: http://activepieces:${AP_HTTP_PORT:-8080}
      AP_EMAIL: ${ADMIN_EMAIL}
      AP_PASSWORD: ${ADMIN_PASSWORD}
      AP_DEPLOY_TARGET: ${AP_DEPLOY_TARGET:-warehouse}
      FLOWS_REPO_URL: ${FLOWS_REPO_URL:-https://github.com/aboxofrice/activepieces-flows.git}
      FLOWS_BRANCH: ${FLOWS_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-5}
      EXPORT_HOUR: ${EXPORT_HOUR:-2}
      TZ: ${TZ:-America/New_York}
      GIT_AUTHOR_NAME: ap-sync (${AP_DEPLOY_TARGET:-warehouse})
      GIT_AUTHOR_EMAIL: ap-sync@${AP_DEPLOY_TARGET:-warehouse}.local
      BACKUP_STATUS_FILE: /backup-status/status
    volumes:
      # flows-repo checkout (/data/flows) + nightly-export state
      - ap_sync_data:/data
      # the backup service's last_success / last_failure, copied into status/<target>.json nightly
      - backup_status:/backup-status:ro

volumes:
  ap_sync_data:
  # also declared in compose.backup.yml (same volume); declared here so ap-sync works without it
  backup_status:
