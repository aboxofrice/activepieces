# managed-by: ap-installer (removed from the data folder when an installer no longer ships it)
# ap-sync helper service, to be merged into the warehouse stack:
#   docker compose -f docker-compose.yml -f compose.ap-sync.yml up -d
# Pull-only: every SYNC_INTERVAL_MINUTES it pulls the flows repo and applies the managed flows. It
# never commits or pushes; staff-built flows are protected by the database backups, not git.
# Gets only what it needs from the stack's .env (generated by install.sh): ADMIN_EMAIL /
# ADMIN_PASSWORD (Community has no API keys), the AP_DEPLOY_* settings and GITHUB_TOKEN, a fine-grained token with read-only
# access to the flows repo (Contents: Read). Nothing else: no AP_* secrets.
# Named volumes only (no host paths): the stack may be driven by a containerized installer.
# The image is built from tools/ap-deploy (see its README) and pulled like the app image; the
# default tag is pinned and moves with the installer.
services:
  ap-sync:
    image: ${AP_SYNC_IMAGE:-ghcr.io/aboxofrice/ap-sync:1.2.0}
    restart: unless-stopped
    depends_on:
      - activepieces
    environment:
      AP_URL: http://activepieces:${AP_HTTP_PORT:-8080}
      AP_EMAIL: ${ADMIN_EMAIL}
      AP_PASSWORD: ${ADMIN_PASSWORD}
      AP_DEPLOY_TARGET: ${AP_DEPLOY_TARGET:-warehouse}
      # what {{ap-base-url}} resolves to; empty = AP_URL above (tools/ap-deploy/README.md)
      AP_DEPLOY_BASE_URL: ${AP_DEPLOY_BASE_URL:-}
      FLOWS_REPO_URL: ${FLOWS_REPO_URL:-https://github.com/aboxofrice/activepieces-flows.git}
      FLOWS_BRANCH: ${FLOWS_BRANCH:-main}
      # read-only (Contents: Read) fine-grained token; empty for a public repo
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-5}
      # log timestamps only
      TZ: ${TZ:-America/New_York}
      # optional healthchecks.io-style URL: pinged after every good pass, <url>/fail after a failed one
      SYNC_HEALTHCHECK_URL: ${SYNC_HEALTHCHECK_URL:-}
    volumes:
      # flows-repo checkout (/data/flows)
      - ap_sync_data:/data

volumes:
  ap_sync_data:
