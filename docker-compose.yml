services:
  activepieces:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: activepieces
    restart: unless-stopped
    ## Enable the following line if you already use AP_EXECUTION_MODE with SANDBOX_PROCESS or old activepieces, checking the breaking change documentation for more info.
    ## privileged: true
    ports:
      - '8080:80'
    depends_on:
      - postgres
      - redis
    env_file: .env
    volumes:
      - ./cache:/usr/src/app/cache
      # Dev-pieces delivery: the runtime scans packages/pieces/** for folders with a
      # built dist/. Under turbo each piece builds to packages/pieces/custom/<name>/dist
      # (the old nx path dist/packages/pieces is gone). Mount the built custom pieces
      # where the loader looks. Requires AP_DEV_PIECES=<folder-names> in .env and the
      # pieces built on the host first (turbo run build --filter='@vqnguyen1/*').
      - ./packages/pieces/custom:/usr/src/app/packages/pieces/custom
    networks:
      - activepieces
  postgres:
    image: 'postgres:14.4'
    container_name: postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    env_file: .env
    environment:
      - 'POSTGRES_DB=${AP_POSTGRES_DATABASE}'
      - 'POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${AP_POSTGRES_USERNAME}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - activepieces
  redis:
    image: 'redis:7.0.7'
    container_name: redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - 'redis_data:/data'
    networks:
      - activepieces
volumes:
  postgres_data:
  redis_data:
networks:
  activepieces:
